project_id = "drop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4004"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:4004/**",
  "http://127.0.0.1:4004/**",
  "http://localhost:5004/**",
  "http://127.0.0.1:5004/**",
  "http://localhost:6004/**",
  "http://127.0.0.1:6004/**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "8MiB"

[functions.cleanup-expired-drop-media]
verify_jwt = false

[functions.manage-drop-push-subscription]
verify_jwt = true

[functions.dispatch-drop-push]
verify_jwt = false
